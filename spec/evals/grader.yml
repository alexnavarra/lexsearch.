# Read Committed
- question: What does the Read Committed isolation level guarantee in PostgreSQL?
  reference_answer: It is the default level. Each statement sees only data committed before that statement began, so it never sees uncommitted data, but two SELECTs in one transaction can see different data (nonrepeatable reads).
  source: Read Committed is the default isolation level in PostgreSQL. When a transaction uses this isolation level, a SELECT query (without a FOR UPDATE/SHARE clause) sees only data committed before the query began; it never sees either uncommitted data or changes committed by concurrent transactions during the query's execution. Note that two successive SELECT commands can see different data, even though they are within a single transaction, if other transactions commit changes after the first SELECT starts and before the second SELECT starts.
  answer: Это уровень по умолчанию. Каждый запрос видит только закоммиченные до его начала данные, грязного чтения нет, но два SELECT в одной транзакции могут вернуть разное.
