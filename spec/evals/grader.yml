# N+1 / includes
- question: How do you solve the N+1 queries problem in Rails?
  reference_answer: Load the associations in advance with includes (or preload / eager_load), so Active Record runs a fixed number of queries instead of one query per record.
  source: The N + 1 queries problem occurs when loading a collection and then one association per record. Active Record lets you specify in advance all the associations that are going to be loaded, using includes, preload or eager_load. With includes, Active Record ensures that all of the specified associations are loaded using the minimum possible number of queries.
  answer: Use includes(:author) on the relation so the authors are loaded in one extra query instead of one per book. preload and eager_load also work.
