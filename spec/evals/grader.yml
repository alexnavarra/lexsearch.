# HNSW vs IVFFlat
- question: How do HNSW and IVFFlat indexes in pgvector differ?
  reference_answer: HNSW builds a multilayer graph; it has better speed-recall tradeoff but builds slower and uses more memory, and can be created on an empty table. IVFFlat splits vectors into lists; it builds faster and uses less memory, but needs data in the table before creating the index.
  source: An HNSW index creates a multilayer graph. It has better query performance than IVFFlat (in terms of speed-recall tradeoff), but has slower build times and uses more memory. Also, an index can be created without any data in the table since there isn't a training step like IVFFlat. An IVFFlat index divides vectors into lists, and then searches a subset of those lists that are closest to the query vector. It has faster build times and uses less memory than HNSW, but has lower query performance. Create the index after the table has some data.
  answer: HNSW — граф из нескольких слоёв, ищет быстрее и точнее, но строится дольше и ест больше памяти, его можно создать на пустой таблице. IVFFlat делит векторы на списки, строится быстро и экономно, но индекс надо создавать, когда данные уже есть.
  human_score: 5
