# GIN
- question: When is a GIN index the right choice in PostgreSQL?
  reference_answer: GIN is an inverted index for values that contain several elements, such as arrays and jsonb. It supports containment operators like @> and is used for full-text search.
  source: GIN indexes are "inverted indexes" which are appropriate for data values that contain multiple component values, such as arrays. An inverted index contains a separate entry for each component value. The standard distribution includes GIN operator classes for arrays (<@, @>, =, &&), jsonb and tsvector.
  answer: For columns holding many elements per value, like arrays or jsonb, and for full-text search on tsvector. It stores an entry per element, so containment queries such as @> are fast.
