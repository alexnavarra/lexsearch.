# Recurring tasks
- question: How do you run a job on a schedule with Solid Queue?
  reference_answer: Define recurring tasks in config/recurring.yml with a job class (or command) and a schedule such as "every day at 3am"; the Solid Queue scheduler enqueues them.
  source: Solid Queue supports defining recurring tasks that run at specific times in the future, on a regular basis like cron jobs. These are managed by the scheduler process and are defined in their own configuration file, config/recurring.yml. Each task specifies a class or command and a schedule, parsed with Fugit, e.g. "every hour" or "at 5am every day".
  answer: Описать задачу в config/recurring.yml — класс задачи и расписание вроде "every day at 3am", а scheduler Solid Queue сам будет ставить её в очередь.
