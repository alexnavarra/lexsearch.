# USD per million tokens, from https://platform.claude.com/docs/en/about-claude/pricing (checked 2026-10-22).
# cache_write is the 5-minute TTL rate. A model id matches the longest key it starts with,
# so dated ids ("claude-haiku-5-5-20260901") use the base entry.
# long: rates for prompts over long_after input tokens (the whole prompt is billed at them).
claude-haiku-5-5:
  input: 0.10
  cache_write: 0.125
  cache_read: 0.01
  output: 0.50
  long_after: 100000
  long: { input: 0.50, cache_write: 0.625, cache_read: 0.05, output: 2.50 }
claude-sonnet-5-5: { input: 2.00, cache_write: 2.50, cache_read: 0.10, output: 10.00 }
claude-opus-5-5: { input: 4.00, cache_write: 5.00, cache_read: 0.20, output: 20.00 }
claude-fable-5-1: { input: 10.00, cache_write: 12.50, cache_read: 0.25, output: 50.00 }
claude-haiku-4-5: { input: 1.00, cache_write: 1.25, cache_read: 0.10, output: 5.00 }
claude-sonnet-4-5: { input: 3.00, cache_write: 3.75, cache_read: 0.30, output: 15.00 }
fake: { input: 0, cache_write: 0, cache_read: 0, output: 0 }
scripted: { input: 0, cache_write: 0, cache_read: 0, output: 0 }
